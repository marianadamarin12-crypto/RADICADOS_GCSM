<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCSM - Acueducto Bogotá</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --azul:#0d2d73;
    --azul2:#1b4cb8;
    --blanco:#ffffff;
    --gris:#f5f7fb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'DM Sans',sans-serif;
}

body{
    background:var(--gris);
}

/* ===================== TOPBAR ===================== */

.topbar{
    width:100%;
    height:60px;
    background:var(--azul);
    display:flex;
    align-items:center;
    padding:0 20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo-text{
    color:white;
    font-size:20px;
    font-weight:700;
    margin-right:30px;
}

.menu{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.menu button{
    border:none;
    padding:10px 16px;
    border-radius:8px;
    background:rgba(255,255,255,0.12);
    color:white;
    cursor:pointer;
    transition:0.3s;
    font-size:14px;
}

.menu button:hover{
    background:rgba(255,255,255,0.25);
}

/* ===================== HERO ===================== */

.hero{
    position:relative;
    min-height:300px;
    background:linear-gradient(135deg,var(--azul),var(--azul2));
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
}

/* Logo fondo superior derecha */

.hero::before{
    content:"";
    position:absolute;
    top:20px;
    right:20px;
    width:320px;
    height:120px;
    background:url('Logo(1).jpg') no-repeat center;
    background-size:contain;
    opacity:0.15;
}

/* Contenido */

.hero-content{
    position:relative;
    z-index:2;
    color:white;
    padding:20px;
}

.hero h1{
    font-size:48px;
    margin-bottom:10px;
}

.hero p{
    font-size:18px;
    opacity:0.9;
}

/* ===================== BOTONES ===================== */

.cards{
    max-width:1200px;
    margin:50px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:30px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    transition:0.3s;
    text-align:center;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    margin-bottom:15px;
    color:var(--azul);
}

.card button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:var(--azul);
    color:white;
    cursor:pointer;
    font-size:14px;
    transition:0.3s;
}

.card button:hover{
    background:var(--azul2);
}

/* ===================== FOOTER ===================== */

footer{
    text-align:center;
    padding:25px;
    background:white;
    margin-top:40px;
    color:#555;
}

/* ===================== RESPONSIVE ===================== */

@media(max-width:768px){

    .hero h1{
        font-size:32px;
    }

    .hero::before{
        width:220px;
        height:90px;
    }

    .menu{
        overflow:auto;
    }
}

</style>
</head>

<body>

<!-- ===================== MENU ===================== -->

<div class="topbar">

    <div class="logo-text">
        GCSM
    </div>

    <div class="menu">
        <button onclick="sinPermiso()">Corredores</button>
        <button onclick="sinPermiso()">Entes Control</button>
        <button onclick="sinPermiso()">Metro</button>
        <button onclick="sinPermiso()">Abastecimiento</button>
        <button onclick="sinPermiso()">Red Matriz</button>
        <button onclick="sinPermiso()">Red Troncal</button>
        <button onclick="sinPermiso()">Bienes Raíces</button>
    </div>

</div>

<!-- ===================== HERO ===================== -->

<section class="hero">

    <div class="hero-content">
        <h1>GCSM</h1>
        <p>Gerencia Corporativa Sistema Maestro</p>
    </div>

</section>

<!-- ===================== TARJETAS ===================== -->

<section class="cards">

    <div class="card">
        <h3>Gestión Documental</h3>
        <button onclick="sinPermiso()">Ingresar</button>
    </div>

    <div class="card">
        <h3>Radicados</h3>
        <button onclick="sinPermiso()">Ingresar</button>
    </div>

    <div class="card">
        <h3>Contratos</h3>
        <button onclick="sinPermiso()">Ingresar</button>
    </div>

    <div class="card">
        <h3>Reportes</h3>
        <button onclick="sinPermiso()">Ingresar</button>
    </div>

</section>

<!-- ===================== FOOTER ===================== -->

<footer>
    © 2025 Acueducto de Bogotá - GCSM
</footer>

<!-- ===================== SCRIPT ===================== -->

<script>

function sinPermiso(){
    alert("No tiene permiso para visualizar");
}

</script>

</body>
</html>
